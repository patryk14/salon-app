# Alembic configuration. The database URL is NOT here — env.py reads it from the
# application settings (DATABASE_URL), so migrations and the app can never
# disagree about where the database is.

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
# env.py imports app.config/app.models — alembic runs as its own process and
# needs the backend directory on sys.path (pytest gets this via pyproject).
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
