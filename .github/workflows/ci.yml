# CI for salon-app.
#
#   pull_request → test only (no AWS: the CI role trusts refs/heads/main exclusively)
#   push to main → test → ┬ build the api image (arm64) → push to ECR
#                         └ build the frontend → sync to S3 → invalidate CloudFront
#
# Image tags: <YYYYMMDD>-<git sha7> (immutable, goes into deployment manifests)
#             sha-<sha7>            (immutable, for tooling that matches by pattern)
# Never `latest` — ECR is IMMUTABLE and would reject the second push anyway.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::381492053759:role/github-actions-salon-app
  ECR_REPOSITORY: salon-api
  WEB_BUCKET: charmskin-web-dev-381492053759
  WEB_DISTRIBUTION_ID: E3QQ15ZBF5L9HL
  API_FUNCTION_NAME: salon-api-dev
  # Compiled into the bundle at build time (astro:env). The dev API does not exist yet —
  # the "Status API" section will show an error until api.pgajewsk.pl is live.
  PUBLIC_API_URL: https://api.pgajewsk.pl

jobs:
  # ------------------------------------------------------------------ test
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Same uv version as mise.toml and the Dockerfile builder — one lockfile, one reader.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend lint
        working-directory: backend
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Backend tests
        working-directory: backend
        run: uv run --locked pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------- build+push
  build-push:
    needs: test
    # Only real commits on main reach AWS. PRs stop after `test`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          sha7="${GITHUB_SHA::7}"
          tag="$(date -u +%Y%m%d)-${sha7}"
          echo "tag=${tag}"   >> "$GITHUB_OUTPUT"
          echo "sha7=${sha7}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Exchanges the temporary AWS credentials for a 12 h docker login token.
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Same Dockerfile as `make build` locally. Native arm64 runner → no QEMU.
      # cache-from/to gha: layer cache between runs, so only the code layer rebuilds.
      # Two-step build: first load the image into the local daemon for a smoke test,
      # then push. Pushing an image nobody has ever started is how a typo in CMD
      # reaches the registry with a green pipeline.
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          load: true
          tags: salon-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image exactly as the platform will (default CMD, no --reload), with
      # the required env but no database, and require /healthz to answer. /readyz is
      # not checked — it needs Postgres, and liveness is what proves the image boots.
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://x:x@localhost:5432/x \
            -e S3_BUCKET=x -e SMTP_HOST=x -e CORS_ORIGINS=http://localhost \
            -e AUTH_ISSUER=https://smoke.invalid -e AUTH_AUDIENCE=smoke \
            salon-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthz OK after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::/healthz did not answer within 15s"; docker logs api; exit 1

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          provenance: false   # keeps a single manifest per tag (no attestation manifests as untagged images)
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ steps.meta.outputs.sha7 }}
          cache-from: type=gha   # everything is cached from the step above → seconds, same layers

  # ----------------------------------------------------------- deploy web
  deploy-web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --delete removes files that no longer exist in dist/ (renamed pages, old hashed assets).
      - name: Sync to S3
        run: aws s3 sync frontend/dist/ "s3://${WEB_BUCKET}/" --delete

      # Edges may cache index.html for a long time; force a refresh of everything.
      # Wildcard invalidations count as one path — the first 1000/month are free.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${WEB_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.{id:Id,status:Status}' --output table

  # ----------------------------------------------------------- deploy api
  # The Lambda itself (role, env, domain) is Terraform's; CI only points it at the
  # image that just passed the smoke test. The CI role may UpdateFunctionCode on
  # this one function and nothing else.
  deploy-api:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # update-function-code is asynchronous: it returns while LastUpdateStatus is
      # still InProgress. The wait matters — without it the smoke test below can
      # get a warm instance still running the PREVIOUS image.
      - name: Point Lambda at the new image
        run: |
          aws lambda update-function-code \
            --function-name "${API_FUNCTION_NAME}" \
            --image-uri "${{ needs.build-push.outputs.registry }}/${ECR_REPOSITORY}:${{ needs.build-push.outputs.image_tag }}" \
            --query '{status:LastUpdateStatus,image:ImageUri}' --output table
          aws lambda wait function-updated-v2 --function-name "${API_FUNCTION_NAME}"

      # End-to-end through the real path: DNS → API Gateway → Lambda → uvicorn.
      # First hit after the update is a cold start, hence the retries.
      - name: Smoke test via api.pgajewsk.pl
        run: |
          ok=""
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://api.pgajewsk.pl/healthz; then
              echo; echo "healthz OK (attempt ${i})"; ok=1; break
            fi
            sleep 3
          done
          [ -n "$ok" ] || { echo "::error::/healthz did not answer after 10 attempts"; exit 1; }

      # The door must stay locked: anonymous requests to anything but the
      # health probe get 401 at the gateway. If this ever returns 200, auth
      # regressed in Terraform — fail loudly.
      - name: Verify anonymous requests are rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.pgajewsk.pl/clients)
          if [ "$code" != "401" ]; then
            echo "::error::/clients answered ${code} without a token (expected 401)"; exit 1
          fi
          echo "anonymous /clients -> 401 OK"
