# CI for salon-app.
# Stage 1, step 1: prove that GitHub → AWS identity works (OIDC, no stored keys).
# Build/test/push to ECR are added once this passes.

name: ci

on:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN of this run.
# id-token: write is what lets the job request an OIDC token from GitHub.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::381492053759:role/github-actions-salon-app

jobs:
  whoami:
    runs-on: ubuntu-24.04-arm   # arm64 runner: same architecture as the Graviton targets
    steps:
      # TEMPORARY debug: decode the OIDC token GitHub mints for this run and print the
      # claims AWS evaluates (sub, aud, iss). The token is short-lived and grants
      # nothing by itself — the role's trust policy is what matters.
      - name: Show OIDC token claims (debug)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c '
          import sys, json, base64
          p = sys.stdin.read().strip()
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ("iss","aud","sub","repository","ref","event_name","repository_owner")}, indent=2))'

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I in AWS?
        run: aws sts get-caller-identity
